[build-system]
requires = [
    "setuptools>=77",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "dice-leaderboard"
version = "0.1.0"

description = "Open Diké Leaderboard: evaluation tooling for bias, fairness, ethics, safety, and compression in large language models."
readme = "README.md"

requires-python = ">=3.10"

license = "MIT"

keywords = [
    "large language models",
    "llm",
    "evaluation",
    "model compression",
    "quantization",
    "fairness",
    "bias",
    "toxicity",
    "ethics",
    "safety",
    "leaderboard",
]

dependencies = [

    "torch>=2.1",
    "transformers>=4.46,<5",
    "accelerate>=0.26",
    "datasets>=2.16,<5",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "tqdm>=4.66",
    "PyYAML>=6.0",
    "huggingface-hub>=0.27",
    "lm_eval[hf] @ git+https://github.com/upunaprosk/lm-evaluation-harness.git@main",
]


[project.optional-dependencies]

bnb = [
    "bitsandbytes>=0.43",
]
gptq = [
    "gptqmodel>=2.0",
]
vllm = [
    "vllm>=0.10",
]

test = [
    "pytest>=8,<10",
    "pytest-cov>=5",
]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5",
]


[project.scripts]
dike = "dike.cli:main"


[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true


[tool.setuptools.packages.find]
where = ["src"]
include = [
    "dike*",
    "bias_bench*",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

markers = [
    "integration: tests that download and load real Hugging Face models",
]

addopts = [
    "-ra",
]