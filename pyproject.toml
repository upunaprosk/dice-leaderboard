[build-system]
requires = [
    "setuptools>=77",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "dice-leaderboard"
version = "0.1.0"

description = "DICE: evaluation and leaderboard tooling for compressed and instruction-tuned language models."
readme = "README.md"

requires-python = ">=3.10"

keywords = [
    "llm",
    "evaluation",
    "compression",
    "quantization",
    "bias",
    "ethics",
    "leaderboard",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.1",
    "transformers>=4.46,<6",
    "accelerate>=0.26",
    "datasets>=2.16,<5",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "tqdm>=4.66",
    "PyYAML>=6.0",
    "huggingface-hub>=0.27",
]


[project.optional-dependencies]
bnb = [
    "bitsandbytes>=0.43",
]
gptq = [
    "gptqmodel>=2.0",
]
lm-eval = [
    "lm_eval[hf]>=0.4.9",
]
vllm = [
    "lm_eval[vllm]>=0.4.9",
]
test = [
    "pytest>=8,<10",
    "pytest-cov>=5",
]

dev = [
    "pytest>=8,<10",
    "pytest-cov>=5",
    "ruff>=0.9",
]


[project.scripts]
dike = "dike.cli:main"


[project.urls]
Homepage = "https://github.com/upunaprosk/dice-leaderboard"
Repository = "https://github.com/upunaprosk/dice-leaderboard"
Issues = "https://github.com/upunaprosk/dice-leaderboard/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true


[tool.setuptools.packages.find]
where = ["src"]
include = [
    "dike*",
    "bias_bench*",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

markers = [
    "integration: tests that download and load real Hugging Face models",
]

addopts = [
    "-ra",
]
